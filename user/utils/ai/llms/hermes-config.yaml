model:
  provider: nous
  default: deepseek/deepseek-v4-flash
  # base_url intentionally omitted: the `nous` provider resolves its
  # inference endpoint from auth state / the default Portal URL. Leaving the
  # stale localhost:11434 base_url would override it.
  # DeepSeek-V4 runs a 1,048,576-token context; Think-Max mode needs >= 384K,
  # so set the full window rather than a low cap.
  context_length: 1048576

agent:
  reasoning_effort: max
  tool_use_enforcement:
    - qwen

display:
  show_reasoning: true

custom_providers:
  - name: Local (localhost:11434)
    base_url: http://localhost:11434/v1/
    model: qwen3.6:35b-a3b

auxiliary:
  compression:
    provider: main
    model: ''
    context_length: 262144

web:
  # Self-hosted Firecrawl (http://localhost:3002) handles both search and
  # extraction. SearXNG still runs locally as Firecrawl's search backend.
  backend: firecrawl
  use_gateway: false

# Enable Hermes' browser toolset. The `browser` tool spawns `agent-browser`
# (provided by `pkgs.agent-browser` in `gbrain.nix`). The browser binary
# itself is pinned to the Nix-wrapped Chromium via
# `home.sessionVariables.AGENT_BROWSER_EXECUTABLE_PATH`.
toolsets:
  enabled:
    - browser

_config_version: 33
