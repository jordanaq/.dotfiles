model:
  provider: nous
  default: '~deepseek/deepseek-v4-flash-latest'
  # base_url intentionally omitted: the `nous` provider resolves its
  # inference endpoint from auth state / the default Portal URL. Leaving the
  # stale localhost:11434 base_url would override it.
  # DeepSeek-V4 runs a 1,048,576-token context; Think-Max mode needs >= 384K,
  # so set the full window rather than a low cap. Using the portal's dedicated
  # -latest alias (routes to newest flash weights, structured-output capable,
  # cheapest tier) instead of the rolling alias (currently 0423 snapshot).
  context_length: 1048576

agent:
  # Retries per provider API call on transient errors (5xx incl. 531, rate
  # limits, connection drops) before the failure surfaces. Default is 3 (4
  # total attempts). Between attempts Hermes sleeps a jittered exponential
  # backoff starting at ~2-5s (capped 60-120s), so higher counts just keep
  # retrying with a few seconds between attempts. Bumped from default 3 for
  # DeepSeek-v4-flash upstream 531 resilience (2026-08-10).
  api_max_retries: 5
  reasoning_effort: medium
  tool_use_enforcement:
    - qwen

display:
  show_reasoning: true
  skin: catppuccin-macchiato

custom_providers: []

auxiliary:
  compression:
    provider: main
    model: ''
    context_length: 262144

web:
  # Self-hosted Firecrawl (http://localhost:3002) handles both search and
  # extraction. SearXNG still runs locally as Firecrawl's search backend.
  backend: firecrawl
  use_gateway: false

# Enable Hermes' browser toolset. The `browser` tool spawns `agent-browser`
# (provided by `pkgs.agent-browser` in `gbrain.nix`). The browser binary
# itself is pinned to the Nix-wrapped Chromium via
# `home.sessionVariables.AGENT_BROWSER_EXECUTABLE_PATH`.
toolsets:
  enabled:
    - browser

# Hindsight memory provider — local-embedded daemon (data stays on this box),
# LLM calls routed to Nous Portal (OpenAI-compatible). See gbrain.nix for the
# venv PYTHONPATH, the hindsight/config.json symlink, and the activation hook
# that refreshes the rotating Nous key into ~/.hermes/.env.
#
# Only ONE external memory provider may be active; this replaces the built-in
# MEMORY.md store for cross-session recall.
memory:
  provider: hindsight
  hindsight:
    mode: local_embedded
    # LLM used by the local Hindsight daemon for extraction/synthesis.
    llm_provider: openai_compatible
    llm_base_url: https://inference-api.nousresearch.com/v1
    # `llm_model` is the model name the daemon sends to the endpoint above.
    # Rolling deepseek-v4-flash: cheap, 1M-ctx, tool-capable, supports the
    # structured output the memory-distill path needs. (The -0731 snapshot is
    # served by Novita and rejects structured output, so stay on the rolling
    # alias — 2026-08-12.)
    llm_model: deepseek/deepseek-v4-flash
    recall_budget: mid
    bank_id: hermes

_config_version: 33
