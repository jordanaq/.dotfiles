model:
  provider: nous
  default: '~deepseek/deepseek-flash-latest'
  # The `nous` provider resolves its inference endpoint from auth state
  # or the default Portal URL.
  # The `~` prefix is a real servable portal ID — the "deepseek flash latest"
  # pointer (routes to the newest non-v4 flash weights, currently v4.1-flash,
  # via a structured-output-capable route). Quote it in YAML.
  # 1,048,576-token context window. $0.035/$0.29 per M — among the cheapest
  # deepseek flash routes on the portal.
  # Probe-verified 2026-09-25 in the runtime and via /v1/chat/completions
  # (routes to deepseek/deepseek-v4.1-flash, returns PROBE_OK).
  # Fleet: 12 cron jobs stay pinned to deepseek/deepseek-v4.1-flash and the
  # politics brief stays pinned to z-ai/glm-5.3-flash (non-PRC, censorship
  # carve-out); unpinned jobs inherit this default.
  context_length: 1048576

agent:
  # Retries per provider API call on transient errors (5xx incl. 531, rate
  # limits, connection drops) before the failure surfaces. Default is 3 (4
  # total attempts). Between attempts Hermes sleeps a jittered exponential
  # backoff starting at ~2-5s (capped 60-120s), so higher counts just keep
  # retrying with a few seconds between attempts. Bumped from default 3 for
  # DeepSeek-v4-flash upstream 531 resilience (2026-08-10).
  api_max_retries: 5
  reasoning_effort: medium
  tool_use_enforcement:
    - qwen

display:
  show_reasoning: true
  skin: catppuccin-macchiato

custom_providers: []

auxiliary:
  compression:
    provider: main
    model: ''
    context_length: 262144

web:
  # Self-hosted Firecrawl (http://localhost:3002) handles both search and
  # extraction. Firecrawl reaches the remote SearXNG server through the
  # local authentication proxy.
  backend: firecrawl
  use_gateway: false

# Hermes uses agent-browser with the Nix-wrapped Chromium from default.nix.
toolsets:
  enabled:
    - browser

# Hindsight stores memory locally and sends LLM calls to Nous Portal.
# See hindsight/default.nix for the local daemon setup and config file.
#
# Only ONE external memory provider may be active; this replaces the built-in
# MEMORY.md store for cross-session recall.
memory:
  provider: hindsight
  hindsight:
    mode: local_embedded
    # LLM used by the local Hindsight daemon for extraction/synthesis.
    llm_provider: openai_compatible
    llm_base_url: https://inference-api.nousresearch.com/v1
    # `llm_model` is the model name the daemon sends to the endpoint above.
    # Rolling deepseek-v4-flash: cheap, 1M-ctx, tool-capable, supports the
    # structured output the memory-distill path needs. (The -0731 snapshot is
    # served by Novita and rejects structured output, so stay on the rolling
    # alias — 2026-08-12.)
    llm_model: deepseek/deepseek-v4-flash
    recall_budget: mid
    bank_id: hermes

_config_version: 33
